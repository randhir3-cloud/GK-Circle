dsn: postgres://gk_circle:change_me_database_password@db:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433/
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true # Ensure this line is included and set to true
  admin:
    base_url: http://localhost:4434/
    port: 4434

selfservice:
  default_browser_return_url: http://localhost:3000
  allowed_return_urls:
    - http://localhost:3000

  methods:
    password:
      enabled: true
    oidc:
      enabled: true
      config:
        base_redirect_uri: http://localhost:4433
        providers:
          - id: google
            provider: google
            mapper_url: "base64://<BASE64-JASONNATE_SCHEMA>"
            auth_url: https://accounts.google.com/o/oauth2/v2/auth
            token_url: https://www.googleapis.com/oauth2/v4/token
            issuer_url: https://accounts.google.com
            client_id: <GOOGLE_CLIENT_ID>
            client_secret: <GOOGLE_CLIENT_SECRET>
            scope:
              - openid
              - email
              - profile
    totp:
      config:
        issuer: Kratos
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:3000/error

    settings:
      ui_url: http://localhost:3000/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://localhost:3000/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:3000/verification
      use: code
      after:
        default_browser_return_url: http://localhost:3000/account/login

    logout:
      after:
        default_browser_return_url: http://localhost:3000/login

    login:
      ui_url: http://localhost:3000/account/login
      # http://127.0.0.1:4433/self-service/login/browser?aal=&refresh=&return_to=
      after:
        default_browser_return_url: http://localhost:3010/api/v1/kratos/auth
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: http://localhost:3000/account/register
      after:
        default_browser_return_url: http://localhost:3010/api/v1/kratos/auth
        password:
          hooks:
            - hook: session
        oidc:
          hooks:
            - hook: session
log:
  level: debug
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - change_me_to_a_long_random_cookie_secret
  cipher:
    - change_me_exactly_32_char_secret

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: ${COURIER_SMTP_CONNECTION_URI}
    from_name: GK Circle
    from_address: ${COURIER_SMTP_FROM_ADDRESS}

  template_override_path: /etc/config/kratos/email-templates

cookies:
  domain: localhost
  path: /
  same_site: Lax
