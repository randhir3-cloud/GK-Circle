<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #F3F4F6; margin: 0; padding: 20px; color: #1A1A1A; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border: 3px solid #1A1A1A; box-shadow: 6px 6px 0px #1A1A1A; padding: 30px; }
        .header { text-align: center; border-bottom: 2px solid #1A1A1A; padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #1A1A1A; }
        .logo span { color: #45E3B8; }
        .badge { display: inline-block; padding: 6px 12px; font-size: 14px; font-weight: bold; background-color: #45E3B8; border: 2px solid #1A1A1A; box-shadow: 2px 2px 0px #1A1A1A; margin-bottom: 15px; }
        h2 { font-size: 22px; font-weight: 700; margin-top: 0; }
        p { line-height: 1.6; font-size: 16px; margin: 0 0 15px 0; }
        .footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #E5E7EB; font-size: 12px; color: #6B7280; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">GK <span>CIRCLE</span></div>
        </div>
        <div class="badge">NEW ACHIEVEMENT UNLOCKED!</div>
        <h2>Congratulations {{.RecipientName}},</h2>
        <p>You have earned the badge <strong>{{.AchievementTitle}}</strong> on GK Circle!</p>
        <p><strong>Description:</strong> {{.Description}}</p>
        <p>Earned at: <strong>{{.EarnedAt}}</strong></p>
        <div class="footer">
            You received this notification because you unlocked a milestone on GK Circle.
        </div>
    </div>
</body>
</html>
