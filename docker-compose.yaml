services:
  db:
    image: postgres:15.2-alpine
    container_name: gk-circle-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-gk_circle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-gk_circle}
      POSTGRES_MULTIPLE_DATABASES: kratos
    ports:
      - 5432:5432
    volumes:
      - ./pkg/kratos/kratos-pg-init-script:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./api/
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      db: 
        condition: service_healthy
    env_file:
      - ./api/.env.docker
      - ./.env
    command: ["./gk-circle", "migrate", "up"]

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    env_file:
      - ./api/.env.docker
      - ./.env
    volumes:
      - redisdata:/root/redis
      - ./api/redis/redis.conf:/usr/local/etc/redis/redis.conf

  api:
    build:
      context: ./api/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: on-failure
    env_file:
      - ./api/.env.docker
    depends_on:
      - kratos
      - db
      - migration
      - redis
    command: ["./gk-circle", "api"]

  web:
    build:
      context: ./app/
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: on-failure
    env_file:
      - ./app/.env.docker
    depends_on:
      - api

  kratos_migrate:
    image: oryd/kratos:v1.0.0
    environment:
      - DSN=postgres://${DB_USERNAME:-gk_circle}:${DB_PASSWORD}@db:5432/kratos?sslmode=disable
      - LOG_LEVEL=trace
    command: migrate sql -e --yes
    restart: on-failure
    depends_on:
      - db
      - migration

  kratos:
    image: oryd/kratos:v1.0.0
    ports:
      - "4433:${SERVE_PUBLIC_PORT:-4433}" # public
      - "4434:${SERVE_ADMIN_PORT:-4434}" # admin
    env_file:
      - ./api/.env.kratos
      - ./.env
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    restart: always
    depends_on:
      db:
        condition: service_healthy
      kratos_migrate:
        condition: service_completed_successfully
    volumes:
      - "./api/pkg/kratos:/etc/config/kratos"

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ~/minio/data:/data
    environment:
      MINIO_ROOT_USER: ROOTNAME
      MINIO_ROOT_PASSWORD: CHANGEME123
    command: server /data --console-address ":9001"

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_SENDMAIL_SMTP_ADDR: mailpit:1025
      MP_SENDMAIL_FROM: test@test.com

volumes:
  pgdata:
  redisdata:
