name: gk-circle-v2

services:
  db:
    image: postgres:15.2-alpine
    container_name: gk-circle-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_MULTIPLE_DATABASES: kratos
    volumes:
      - ./api/pkg/kratos/kratos-pg-init-script:/docker-entrypoint-initdb.d:ro
      - gk-circle-v2-pgdata:/var/lib/postgresql/data
    networks: [gk-circle-v2-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: gk-circle-v2-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - gk-circle-v2-redisdata:/data
    networks: [gk-circle-v2-network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migration:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gk-circle-v2-migration
    env_file: .env
    command: ["./gk-circle", "migrate", "up"]
    depends_on:
      db:
        condition: service_healthy
    networks: [gk-circle-v2-network]
    restart: "no"

  kratos-migrate:
    image: oryd/kratos:v1.0.0
    container_name: gk-circle-v2-kratos-migrate
    environment:
      DSN: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    depends_on:
      db:
        condition: service_healthy
    networks: [gk-circle-v2-network]
    restart: "no"

  kratos:
    image: oryd/kratos:v1.0.0
    container_name: gk-circle-v2-kratos
    restart: unless-stopped
    env_file: .env
    environment:
      DSN: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/kratos?sslmode=disable
      SERVE_PUBLIC_BASE_URL: https://gkcircle.com/kratos/
      SERVE_PUBLIC_HOST: 0.0.0.0
      SERVE_ADMIN_BASE_URL: http://kratos:4434/
      SERVE_ADMIN_HOST: 0.0.0.0
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: https://gkcircle.com
      SELFSERVICE_ALLOWED_RETURN_URLS: https://gkcircle.com
      SELFSERVICE_FLOWS_ERROR_UI_URL: https://gkcircle.com/error
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: https://gkcircle.com/settings
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: https://gkcircle.com/recovery
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: https://gkcircle.com/verification
      SELFSERVICE_FLOWS_LOGIN_UI_URL: https://gkcircle.com/account/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: https://gkcircle.com/account/register
      SELFSERVICE_FLOWS_LOGIN_AFTER_DEFAULT_BROWSER_RETURN_URL: https://gkcircle.com/api/v1/kratos/auth
      SELFSERVICE_FLOWS_REGISTRATION_AFTER_DEFAULT_BROWSER_RETURN_URL: https://gkcircle.com/api/v1/kratos/auth
      SELFSERVICE_FLOWS_VERIFICATION_AFTER_DEFAULT_BROWSER_RETURN_URL: https://gkcircle.com/account/login
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: https://gkcircle.com/account/login
      SELFSERVICE_METHODS_OIDC_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: https://gkcircle.com
      COOKIES_DOMAIN: gkcircle.com
      COOKIES_SAME_SITE: Lax
      COOKIES_SECURE: "true"
      COURIER_SMTP_CONNECTION_URI: ${COURIER_SMTP_CONNECTION_URI}
      COURIER_SMTP_FROM_ADDRESS: ${COURIER_SMTP_FROM_ADDRESS}
      LOG_LEAK_SENSITIVE_VALUES: "false"
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - ./api/pkg/kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./api/pkg/kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
      - ./api/pkg/kratos/email-templates:/etc/config/kratos/email-templates:ro
    networks: [gk-circle-v2-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4434/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gk-circle-v2-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      SERVE_PUBLIC_BASE_URL: http://kratos:4433
      WEB_URL: https://gkcircle.com
    command: ["./gk-circle", "api"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kratos:
        condition: service_healthy
    networks: [gk-circle-v2-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gk-circle-v2-web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_BASE_URL: https://gkcircle.com
      NUXT_PUBLIC_API_URL: https://gkcircle.com/api/v1
      NUXT_PUBLIC_API_SOCKET_URL: wss://gkcircle.com/api/v1/socket
      NUXT_PUBLIC_KRATOS_URL: https://gkcircle.com/kratos
      NUXT_PUBLIC_REDIRECT_ALLOWED_ORIGINS: https://gkcircle.com
    depends_on:
      api:
        condition: service_healthy
    networks: [gk-circle-v2-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway:
    image: nginx:1.27-alpine
    container_name: gk-circle-v2-gateway
    restart: unless-stopped
    ports:
      - "${GK_CIRCLE_HTTP_PORT:-3200}:80"
    volumes:
      - ./deploy/nginx.nuc.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [gk-circle-v2-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: gk-circle-v2-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - gk-circle-v2-minio-data:/data
    networks: [gk-circle-v2-network]

  mailpit:
    image: axllent/mailpit
    container_name: gk-circle-v2-mailpit
    restart: unless-stopped
    volumes:
      - gk-circle-v2-maildata:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    networks: [gk-circle-v2-network]

volumes:
  gk-circle-v2-pgdata:
    name: gk-circle-v2-pgdata
  gk-circle-v2-redisdata:
    name: gk-circle-v2-redisdata
  gk-circle-v2-minio-data:
    name: gk-circle-v2-minio-data
  gk-circle-v2-maildata:
    name: gk-circle-v2-maildata

networks:
  gk-circle-v2-network:
    name: gk-circle-v2-network
    driver: bridge
