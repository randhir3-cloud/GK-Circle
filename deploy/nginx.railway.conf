events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 20M;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    upstream gk_api {
        server api.railway.internal:3000;
    }

    upstream gk_web {
        server web.railway.internal:5000;
    }

    upstream gk_kratos {
        server kratos.railway.internal:4433;
    }

    server {
        listen 8080 default_server;
        server_name _;

        resolver 127.0.0.11 valid=5s;

        location = /healthz {
            set $health_upstream http://api.railway.internal:3000/api/healthz/;
            proxy_pass $health_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/ {
            set $api_upstream http://api.railway.internal:3000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ~ ^/kratos/(.*)$ {
            set $kratos_path /$1;
            set $kratos_upstream http://kratos.railway.internal:4433$kratos_path$is_args$args;
            proxy_pass $kratos_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ~ ^/mailpit/(.*)$ {
            set $mailpit_path /$1;
            set $mailpit_upstream http://mailpit.railway.internal:8025$mailpit_path$is_args$args;
            proxy_pass $mailpit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            set $web_upstream http://web.railway.internal:5000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}

