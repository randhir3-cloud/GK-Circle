name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DB_PASSWORD: change_me_database_password
  REDIS_PASSWORD: change_me_redis_password
  SECRETS_COOKIE: change_me_to_a_long_random_cookie_secret
  SECRETS_CIPHER: change_me_exactly_32_char_secret
  MINIO_ROOT_USER: change_me_minio_user
  MINIO_ROOT_PASSWORD: change_me_minio_password
  PGADMIN_EMAIL: admin@gk-circle.local
  PGADMIN_PASSWORD: change_me_pgadmin_password
  PGADMIN_PORT: 5051
  SERVE_PUBLIC_PORT: 4433
  SERVE_ADMIN_PORT: 4434

jobs:
  backend-verify:
    name: Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install Dependencies
        working-directory: ./api
        run: go mod download

      - name: Run Go Vet
        working-directory: ./api
        run: go vet ./...

      - name: Run Go Tests
        working-directory: ./api
        run: go test ./... -v

      - name: Run Go Tests with Race Detector
        working-directory: ./api
        run: go test -race ./... -v

      - name: Create CI environment file
        run: |
          cat <<EOF > .env
          DB_PASSWORD=${{ env.DB_PASSWORD }}
          REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}
          SECRETS_COOKIE=${{ env.SECRETS_COOKIE }}
          SECRETS_CIPHER=${{ env.SECRETS_CIPHER }}
          MINIO_ROOT_USER=${{ env.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ env.MINIO_ROOT_PASSWORD }}
          PGADMIN_EMAIL=${{ env.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD=${{ env.PGADMIN_PASSWORD }}
          PGADMIN_PORT=${{ env.PGADMIN_PORT }}
          SERVE_PUBLIC_PORT=${{ env.SERVE_PUBLIC_PORT }}
          SERVE_ADMIN_PORT=${{ env.SERVE_ADMIN_PORT }}
          EOF

      - name: Smoke-test Docker verification service
        run: |
          docker compose --profile verify config
          docker compose --profile verify build api-verify
          docker compose --profile verify run --rm api-verify go test ./...

  frontend-verify:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Run Frontend Lint
        working-directory: ./app
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: ./app
        run: npm test -- --run

      - name: Run Frontend Build
        working-directory: ./app
        run: npm run build

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs:
      - backend-verify
      - frontend-verify
      - repository-safety
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Install Playwright Browsers and Deps
        working-directory: ./app
        run: npx playwright install --with-deps

      - name: Create CI environment file
        run: |
          cat <<EOF > .env
          DB_PASSWORD=${{ env.DB_PASSWORD }}
          REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}
          SECRETS_COOKIE=${{ env.SECRETS_COOKIE }}
          SECRETS_CIPHER=${{ env.SECRETS_CIPHER }}
          MINIO_ROOT_USER=${{ env.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ env.MINIO_ROOT_PASSWORD }}
          PGADMIN_EMAIL=${{ env.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD=${{ env.PGADMIN_PASSWORD }}
          PGADMIN_PORT=${{ env.PGADMIN_PORT }}
          SERVE_PUBLIC_PORT=${{ env.SERVE_PUBLIC_PORT }}
          SERVE_ADMIN_PORT=${{ env.SERVE_ADMIN_PORT }}
          EOF

      - name: Start Docker Compose services
        run: |
          docker compose config --quiet
          docker compose up -d --build

      - name: Wait for services to be ready
        shell: bash
        run: |
          echo "Polling health check endpoints..."
          for i in $(seq 1 45); do
            if docker compose exec -T db pg_isready -U gk_circle -d gk_circle >/dev/null 2>&1 && \
               docker compose exec -T redis redis-cli ping >/dev/null 2>&1 && \
               curl --fail --silent http://localhost:4433/health/ready >/dev/null 2>&1 && \
               curl --fail --silent http://localhost:3010/api/healthz/ >/dev/null 2>&1 && \
               curl --fail --silent http://localhost:3000/ >/dev/null 2>&1 && \
               curl --fail --silent http://localhost:8025/ >/dev/null 2>&1; then
              echo "All services are healthy!"
              exit 0
            fi
            echo "Waiting for services to be ready (attempt $i/45)..."
            sleep 4
          done
          echo "Services failed to become healthy in time."
          docker compose ps --all
          docker compose logs --no-color
          exit 1

      - name: Run Playwright Tests
        working-directory: ./app
        env:
          HEADLESS: "true"
        run: npx playwright test

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/docker
          docker compose ps --all > artifacts/docker/compose-ps.txt
          docker compose logs --no-color > artifacts/docker/compose.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
            artifacts/docker
          retention-days: 14

      - name: Stop test stack
        if: always()
        run: docker compose down -v --remove-orphans

  repository-safety:
    name: Repository Safety Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject whitespace errors
        run: git diff --check

      - name: Scan tracked files for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject verification security regressions
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'e2e-cleanup|X-E2E-Secret' -- api app deploy; then
            echo 'Public E2E cleanup endpoint reference detected.'
            exit 1
          fi
          if grep -n -E '/mailpit/|mailpit\.railway\.internal' deploy/nginx.*.conf; then
            echo 'Production Mailpit route detected.'
            exit 1
          fi
          if git grep -n -E 'console\.(log|info|debug).*([Vv]erification.?[Cc]ode|[Pp]assword|csrf|Authorization)' -- app api; then
            echo 'Sensitive verification logging detected.'
            exit 1
          fi
          if git grep -n -E 'PLAYWRIGHT_BASE_URL[^\n]*https://gkcircle\.com' -- app/tests app/playwright.config.ts; then
            echo 'Production E2E default detected.'
            exit 1
          fi
          if git grep -n -E "PASSWORD[^\n]*\|\|[[:space:]]*['\"]" -- app/tests/e2e; then
            echo 'Hardcoded E2E credential fallback detected.'
            exit 1
          fi
          if git grep -n -E "password:[[:space:]]*['\"][^$]" -- app/tests/e2e; then
            echo 'Hardcoded E2E password detected.'
            exit 1
          fi
