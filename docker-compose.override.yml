# =============================================================
# GK Circle - docker-compose.override.yml
#
# This file is automatically merged with docker-compose.yaml
# by Docker Compose (no extra flags needed for `up`).
#
# Evaluation changes applied here:
#   - Isolated named network (gk-circle-network)
#   - Fixed DB healthcheck (was checking wrong user)
#   - Named volumes (all persistent)
#   - Restart policies on all services
#   - Web exposed on port 3000 (was 5000)
#   - API exposed on port 3010 (was 3000)
#   - DB ports NOT exposed to host
#   - Optional pgAdmin profile
# =============================================================

services:

  db:
    container_name: gk-circle-db
    restart: unless-stopped
    # Healthcheck uses the GK Circle development database identity.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gk_circle -d gk_circle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gk-circle-network
    ports: !reset []

  migration:
    container_name: gk-circle-migration
    networks:
      - gk-circle-network

  redis:
    container_name: gk-circle-redis
    restart: unless-stopped
    # Remove external port exposure (internal only)
    ports: !reset []
    networks:
      - gk-circle-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: gk-circle-api
    restart: unless-stopped
    # Local course-admin allowlist snippet (created by scripts/seed-local-course-admin.mjs).
    # Base compose already loads api/.env.docker; repeat it here so the merge keeps both.
    env_file:
      - ./api/.env.docker
      - path: ./api/.env.local.course-admin
        required: false
    # Expose API on 3010 (web gets 3000 below)
    ports: !override
      - "3010:3000"
    networks:
      - gk-circle-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://gk-circle-api:3000/api/healthz/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    container_name: gk-circle-web
    restart: unless-stopped
    # Remap: host 3000 → container 5000
    ports: !override
      - "3000:5000"
    networks:
      - gk-circle-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  kratos_migrate:
    container_name: gk-circle-kratos-migrate
    networks:
      - gk-circle-network

  kratos:
    container_name: gk-circle-kratos
    restart: unless-stopped
    networks:
      - gk-circle-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4433/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    container_name: gk-circle-minio
    restart: unless-stopped
    # Fix: use named volume instead of home dir mount
    volumes:
      - gk-circle-minio-data:/data
    networks:
      - gk-circle-network

  mailpit:
    restart: unless-stopped
    ports: !override
      - "8025:8025"
      - "1026:1025"
    networks:
      - gk-circle-network

  # ── pgAdmin (optional — run with: docker compose --profile tools up) ──
  gk-circle-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gk-circle-pgadmin
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_secret}
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - gk-circle-pgadmin-data:/var/lib/pgadmin
    networks:
      - gk-circle-network
    depends_on:
      - db

  api-verify:
    networks:
      - gk-circle-network

# ── Extend volumes with named definitions ─────────────────
volumes:
  pgdata:
    name: gk-circle-pgdata
  redisdata:
    name: gk-circle-redisdata
  gk-circle-minio-data:
    name: gk-circle-minio-data
  gk-circle-pgadmin-data:
    name: gk-circle-pgadmin-data

# ── Isolated Network ──────────────────────────────────────
networks:
  gk-circle-network:
    name: gk-circle-network
    driver: bridge
